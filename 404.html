<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Circuit Court</title>
    <script>
      (function () {
        var base = '/CircuitCourt'
        var path = window.location.pathname
        if (path.indexOf(base) === 0) path = path.slice(base.length)
        var target = (path || '/') + window.location.search + window.location.hash
        sessionStorage.setItem('circuitcourt_spa_redirect', target)
        window.location.replace(base + '/')
      })()
    </script>
  </head>
  <body>
    <p>Redirection vers <a href="/CircuitCourt/">Circuit Court</a>…</p>
  </body>
</html>
